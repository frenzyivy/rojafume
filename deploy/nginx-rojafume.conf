# RojaFume pre-launch — nginx site config
#
# Install:  see ../DEPLOY.md, or just run deploy/setup-vps.sh which does it for you.
# Path:     /etc/nginx/sites-available/rojafume  (symlinked into sites-enabled)
#
# If your domain is not rojafume.com, replace every occurrence below. There are
# no other changes needed.
#
# Certbot rewrites parts of this file when it installs the certificate. That is
# expected — it adds the listen 443 lines, the ssl_certificate paths and the
# HTTP->HTTPS redirect. This file is written so that the result is correct.

# ─── Port 80: hand everything to HTTPS ───────────────────────────────────────
# Certbot needs this block to answer the ACME challenge before a certificate
# exists, so keep it even after HTTPS is working.
server {
    listen 80;
    listen [::]:80;
    server_name rojafume.com www.rojafume.com;

    # Let's Encrypt renewal checks must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/rojafume;
    }

    location / {
        return 301 https://rojafume.com$request_uri;
    }
}

# ─── www -> apex, so the page has exactly one address ────────────────────────
# Two addresses serving the same page splits analytics and looks careless when
# shared. Pick the apex; anyone typing www lands on it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rojafume.com;

    ssl_certificate     /etc/letsencrypt/live/rojafume.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rojafume.com/privkey.pem;
    # TLS settings inlined on purpose: an `include` of certbot's
    # options-ssl-nginx.conf only exists if certbot's nginx plugin ran, and
    # `nginx -t` fails hard when the included file is missing.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:RojaFumeTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://rojafume.com$request_uri;
}

# ─── The site ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rojafume.com;

    root /var/www/rojafume;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/rojafume.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rojafume.com/privkey.pem;
    # TLS settings inlined on purpose: an `include` of certbot's
    # options-ssl-nginx.conf only exists if certbot's nginx plugin ran, and
    # `nginx -t` fails hard when the included file is missing.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:RojaFumeTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers ──
    # HSTS: browsers refuse plain HTTP for this domain for a year. Only switch
    # this on once HTTPS definitely works — it is hard to undo, because browsers
    # remember it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy, matched to exactly what the page uses:
    #   fonts.googleapis.com  the Poppins stylesheet
    #   fonts.gstatic.com     the font files that stylesheet pulls
    #   script.google.com     the signup endpoint...
    #   script.googleusercontent.com  ...which 302-redirects here on POST
    # 'unsafe-inline' is needed because the page's CSS and JS are inline (single
    # file, no build step). External script injection is still blocked.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ── Caching ──
    # The HTML must not be cached hard, or a copy change will not reach people
    # who already visited. The logo can be cached for a long time.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Hygiene ──
    server_tokens off;                  # do not advertise the nginx version
    location ~ /\. { deny all; }        # no dotfiles, ever
    access_log /var/log/nginx/rojafume.access.log;
    error_log  /var/log/nginx/rojafume.error.log;

    # A one-page site: anything unknown goes to the page rather than a 404,
    # so a mistyped link still shows the signup form.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
